name: Release Check

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NPM_VERSION: "11.9.0"

jobs:
  verify:
    name: Verify (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.13.0", 24]

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin npm
        run: npm install --global "npm@$NPM_VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Run smoke checks
        run: npm run check

      - name: Audit dependency tree
        if: matrix.node-version == 24
        run: npm audit --audit-level=high

  browser-contract:
    name: Browser Contract (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin npm
        run: npm install --global "npm@$NPM_VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Run cross-platform browser contract
        env:
          VISUAL_SKIP_DIFF: "1"
          VISUAL_STRICT: "1"
        run: npm run visual:check
